[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causilo"
version = "1.0.0"
description = "Pretrained tabular classification and regression"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Nums AI Inc.", email = "contact@nums.world"}]
dependencies = [
    "torch>=2.13", "numpy", "pandas", "scipy", "scikit-learn>=1.6",
    "safetensors>=0.8", "huggingface-hub>=0.28", "psutil",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/nums-ai/causilo"
Issues = "https://github.com/nums-ai/causilo/issues"
Models = "https://huggingface.co/nums-ai/causilo"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "build", "twine", "joblib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not pretrained'"
markers = ["pretrained: requires access to official model weights"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
